name: Build iOS IPA (Godot 3.5.3)

on:
  push:
    branches:
      - coderabbit/support-ssp-on-ios/5bce3dd4
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 3.5.3-stable

jobs:
  export-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and iOS export template
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_linux_headless.64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/templates/3.5.3.stable"
          unzip -p "$RUNNER_TEMP/templates.tpz" templates/iphone.zip > "$HOME/.local/share/godot/templates/3.5.3.stable/iphone.zip"
      - name: Test iOS project preparation
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Prepare isolated iOS project
        run: python3 tools/prepare_ios.py "$RUNNER_TEMP/ssp-ios"
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          Godot_v${GODOT_VERSION}_linux_headless.64 --path "$RUNNER_TEMP/ssp-ios" --export-pack iOS "$RUNNER_TEMP/import.pck" 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Error importing' "$RUNNER_TEMP/import.log"; then exit 1; fi
      - name: Export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          # Godot 3 uses --export. Linux generates Xcode files without invoking signing.
          Godot_v${GODOT_VERSION}_linux_headless.64 --path "$RUNNER_TEMP/ssp-ios" --export iOS "$GITHUB_WORKSPACE/build/ios/Rhythia.ipa" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -E 'SCRIPT ERROR|Parse Error|^ERROR:' "$RUNNER_TEMP/export.log"; then exit 1; fi
          test -s build/ios/Rhythia.xcodeproj/project.pbxproj
          test -s build/ios/Rhythia.pck
      - uses: actions/upload-artifact@v4
        with:
          name: Rhythia-Xcode
          path: build/ios/
          if-no-files-found: error
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-export-logs
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/export.log

  build-ios:
    needs: export-ios
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rhythia-Xcode
          path: build/ios
      - name: Archive unsigned application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project build/ios/Rhythia.xcodeproj \
            -scheme Rhythia \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/Rhythia.xcarchive" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          test -d build/ios/Rhythia.xcarchive/Products/Applications/Rhythia.app
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/Payload
          cp -R build/ios/Rhythia.xcarchive/Products/Applications/Rhythia.app build/ios/Payload/
          cd build/ios
          zip -qr Rhythia-unsigned.ipa Payload
          test -s Rhythia-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Rhythia-iOS-unsigned
          path: build/ios/Rhythia-unsigned.ipa
          if-no-files-found: error
