name: Build iOS IPA (Godot 3.5.3)

on:
  workflow_dispatch:

env:
  GODOT_VERSION: 3.5.3-stable
  IOS_PRESET: iOS
  NAME: Rhythia

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot 3.5.3
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_osx.universal.zip
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          godot --version

      - name: Download export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/3.5.3.stable
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/3.5.3.stable/

      - name: Diagnostics
        run: |
          echo "--- assets/images/branding ---"
          ls -la assets/images/branding/ 2>/dev/null || echo "MISSING DIR"
          echo "--- autoloads in project.godot ---"
          grep -A 40 '\[autoload\]' project.godot 2>/dev/null || echo "no autoload"
          echo "--- export_presets.cfg ---"
          cat export_presets.cfg 2>/dev/null || echo "MISSING PRESETS"

      - name: Neutralize GDNative addons (binaries + native script refs)
        run: |
          # Delete native binaries AND .gdns/.gdnlib (they tell Godot to load a native lib)
          find addons -type f \( \
            -name "*.dylib" -o -name "*.so" -o -name "*.dll" \
            -o -name "*.gdns" -o -name "*.gdnlib" \
            \) -print -delete || true

          # Stub Discord autoload - Rhythia.gd references `Discord.xyz()` so it must exist
          mkdir -p addons/discord_game_sdk
          cat > addons/discord_game_sdk/discord.gd << 'EOF'
extends Node
# STUB for iOS build - native SDK removed
func _ready(): pass
func _init(): pass
EOF

          # Stub native_dialogs autoload
          mkdir -p addons/native_dialogs
          cat > addons/native_dialogs/native_dialogs.gd << 'EOF'
extends Node
# STUB for iOS build - native SDK removed
func _ready(): pass
func _init(): pass
EOF

          echo "--- after neutralize ---"
          find addons -type f | head -40

      - name: Import project (wait until .import stabilizes)
        run: |
          set +e
          godot --headless --editor --path . &
          PID=$!
          LAST=0
          STABLE=0
          for i in $(seq 1 120); do
            sleep 5
            COUNT=$(ls .import 2>/dev/null | wc -l | tr -d ' ')
            echo "iter $i: .import count = $COUNT"
            if [ "$COUNT" = "$LAST" ] && [ "$COUNT" -gt 100 ]; then
              STABLE=$((STABLE+1))
              if [ "$STABLE" -ge 4 ]; then
                echo "Import stable at $COUNT files."
                break
              fi
            else
              STABLE=0
            fi
            LAST=$COUNT
          done
          kill -INT $PID 2>/dev/null || true
          sleep 3
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
          echo "Final .import count: $(ls .import 2>/dev/null | wc -l | tr -d ' ')"
          # Sprawdź czy .import zawiera icon.png
          ls .import/ | grep -i "icon" | head -5 || true

      - name: Patch export preset
        run: |
          if [ -f export_presets.cfg ]; then
            sed -i '' 's/app_store_team_id=""/app_store_team_id="ABCDE12345"/' export_presets.cfg
          fi

      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          set +e
          godot --headless --path . --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj
          echo "Godot exit code: $?"
          echo "--- build/ios contents ---"
          find build/ios -maxdepth 3 | head -60

      - name: xcodebuild archive (unsigned)
        if: success()
        run: |
          set +e
          PROJ="build/ios/${NAME}.xcodeproj"
          if [ ! -d "$PROJ" ]; then
            echo "No xcodeproj at $PROJ - skipping"
            exit 0
          fi
          xcodebuild archive \
            -project "$PROJ" \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        if: success()
        run: |
          set +e
          if [ ! -d build/ios/App.xcarchive ]; then
            echo "No xcarchive - skipping IPA packaging"
            exit 0
          fi
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../
          ls -la "${NAME}.ipa"

      - name: Upload everything
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-build
          path: |
            build/
            .import/
            Rhythia.ipa
          if-no-files-found: warn
