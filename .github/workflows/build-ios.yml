name: Build iOS IPA

on:
  workflow_dispatch: # Uruchamiane ręcznie z zakładki Actions

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

      - name: Download export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable
          unzip -q templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      - name: Export iOS project
        run: |
          mkdir -p build/ios
          # Nazwa "iOS" musi być zgodna z export_presets.cfg
          godot --headless --path . --export-release "iOS" build/ios/Rhythia.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythia-unsigned-ipa
          path: build/ios/*.ipa
